<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Ahoylist Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      max-width: 600px;
      padding: 32px;
      background: #020617;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #38bdf8;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .highlight {
      color: #22c55e;
      font-weight: bold;
    }

    footer {
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Movie Website খুঁজছেন?</h1>
    <p>
      আপনারা যারা <span class="highlight">Movie দেখার জন্য website</span> খুঁজছেন,
      কিন্তু পাচ্ছেন না—
      তারা <span class="highlight">Google search bar</span>-এ গিয়ে
      <span class="highlight">"Ahoylist"</span> লিখে search করুন।
      <br><br>
      তাহলে সেখানে website list আসবে, কোন কোন website-এ movie দেখতে পারবেন
      সব দেওয়া থাকবে।
    </p>
    <p>ধন্যবাদ। Kindly page টা follow দিয়েন। 🤍</p>
    <footer>© Ahoylist</footer>
  </div>
</body>
</html>
